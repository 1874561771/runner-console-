<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Runner Console · UIAutomation</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<!-- 零构建：纯静态 ES Modules，浏览器原生加载。file:// 下 module 受限时，用 `python -m http.server` 起本地服务预览。 -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="css/design-tokens.css"/>
</head>
<body>

<!-- ═══ 顶栏 ═══ -->
<header class="topbar">
  <div class="topbar-brand">
    <svg class="topbar-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 17l4-8 4 5 3-9 3 6h4" stroke="#FF6B2C" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="topbar-title">Runner Console <span class="topbar-sub">· UIAutomation</span></span>
  </div>
  <div class="topbar-spacer"></div>
  <span class="pill" id="status-pill" data-state="idle">
    <span class="pill-dot"></span><span class="pill-text">idle</span>
  </span>
  <span class="topbar-user" id="topbar-user">—</span>
</header>

<div class="layout">
  <!-- ═══ 左侧导航 ═══ -->
  <nav class="sidenav" aria-label="主导航">
    <div class="sidenav-label">工作区</div>
    <a class="nav-item" href="#/console"    data-route="console">运行台</a>
    <a class="nav-item" href="#/tasks"      data-route="tasks">任务中心</a>
    <a class="nav-item" href="#/dashboard"  data-route="dashboard">数据看板</a>
    <a class="nav-item" href="#/resources"  data-route="resources">资源</a>
    <a class="nav-item" href="#/admin"      data-route="admin">管理</a>
    <div class="sidenav-spacer"></div>
    <div class="workdir-card">
      <div class="workdir-label">WORKDIR</div>
      <div class="workdir-path" id="workdir-path">…</div>
    </div>
  </nav>

  <!-- ═══ 内容区 ═══ -->
  <main class="content" id="view"></main>
</div>

<!-- ═══ 登录浮层 ═══ -->
<div class="login-overlay" id="login-overlay" hidden>
  <div class="login-card card">
    <div class="login-head">
      <svg class="login-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 17l4-8 4 5 3-9 3 6h4" stroke="#D9480F" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>登录 Runner Console</h2>
      <p class="login-intro muted" id="login-intro">
        内网自动化运行平台。账号由管理员创建，登录方式见下方页签。
      </p>
    </div>

    <div class="login-tabs" id="login-tabs" role="tablist">
      <button type="button" class="login-tab" data-mode="gitlab">GitLab PAT 登录</button>
      <button type="button" class="login-tab active" data-mode="local">本地账号登录</button>
    </div>

    <form id="login-form" autocomplete="off">
      <div class="field" id="login-field-user">
        <label for="login-user">用户名</label>
        <input class="input" type="text" id="login-user" placeholder="管理员分配的用户名" autocomplete="username"/>
      </div>
      <div class="field" hidden>
        <label for="login-token" id="login-token-label">GitLab PAT</label>
        <input class="input" type="password" id="login-token" placeholder="glpat-…" autocomplete="current-password"/>
      </div>
      <div class="field" id="login-field-pass">
        <label for="login-pass">密码</label>
        <input class="input" type="password" id="login-pass" placeholder="管理员分配的口令" autocomplete="current-password"/>
      </div>
      <p class="login-err" id="login-err" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="btn-login">登 录</button>
    </form>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
